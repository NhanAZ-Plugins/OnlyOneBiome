name: Build and validate plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test chunk biome transformation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OnlyOneBiome source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
          path: .test-dependencies/axolotl-pm
          persist-credentials: false
      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .test-dependencies/setup-php-action
          persist-credentials: false
      - name: Set up Axolotl-PM PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.4"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.test-dependencies/setup-php-action/dist/index.js"
      - name: Install pinned Axolotl-PM dependencies
        run: composer install --working-dir=.test-dependencies/axolotl-pm --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Run chunk biome transformation test
        run: php tests/chunk-transformer.php .test-dependencies/axolotl-pm

  build:
    needs: test
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@v2
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
